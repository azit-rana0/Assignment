<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Pages</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }

      .container {
        width: 100%;
        height: 100%;
        display: flex;
      }

      .clickImng {
        background: #80808020;
        height: 100%;
      }

      .page {
        background: #80808020;
        padding: 8px 1px 6px 8px;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- for clicking Image -->
      <iframe class="clickImng" src="./linkPage.html" frameborder="1"></iframe>

      <!-- this is for open link -->
      <iframe
        class="page"
        src="../Bittoo Aggarwal/index.html"
        frameborder="1"
        name="web-page"
      ></iframe>
    </div>
  </body>
</html>
